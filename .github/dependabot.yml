version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # メジャーバージョンアップは group 対象外のため、OSS 1 個につき 1 PR で個別に作成される

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # メジャーバージョンアップは group 対象外のため、OSS 1 個につき 1 PR で個別に作成される
