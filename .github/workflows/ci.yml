name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: リストア
        run: dotnet restore ZDD.Net.sln

      - name: ビルド
        run: dotnet build ZDD.Net.sln --no-restore --configuration Release

      - name: テスト
        run: >
          dotnet test tests/ZDD.Net.Tests/ZDD.Net.Tests.csproj
          --no-restore
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger trx

      - name: プロパティテスト
        # 既定の試行回数は 1 プロパティ 100 回（tests/ZDD.Net.Tests.Properties の PropertyCheck）。
        # 増やしたいときは ZDD_PROPERTY_ITER を、種を変えたいときは ZDD_PROPERTY_SEED を渡す。
        run: >
          dotnet test tests/ZDD.Net.Tests.Properties/ZDD.Net.Tests.Properties.csproj
          --no-restore
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger trx

      - name: Graphviz のインストール
        # DOT 出力（Zdd.ToDot）の文法を本物の dot に通して確かめるため。テスト側
        # （tests/ZDD.Net.Tests/Harness/DotSyntax.cs）が見るのは構造だけで、文法そのものは見ない。
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y graphviz

      - name: サンプル CLI の実行と DOT の検証
        run: |
          set -euo pipefail
          mkdir -p ./dot
          for family in powerset singletons full; do
            dotnet run --project samples/Zdd.Cli --no-restore --no-build --configuration Release \
              -- --family "$family" --items 6 --stats --dot "./dot/$family.gv"
            dot -Tsvg "./dot/$family.gv" -o "./dot/$family.svg"
          done

      - name: api-guide サンプルの実行
        # docs/api-guide.md に載せているコード片(samples/Zdd.ApiGuide)を実際に動かし、
        # ガイドのサンプルが壊れていないことを確かめる。
        run: >
          dotnet run --project samples/Zdd.ApiGuide --no-restore --no-build --configuration Release

      - name: frontier-guide サンプルの実行
        # docs/frontier-guide.md に載せているコード片(samples/Zdd.FrontierGuide)を実際に動かし、
        # ガイドのサンプルが壊れていないことを確かめる。
        run: >
          dotnet run --project samples/Zdd.FrontierGuide --no-restore --no-build --configuration Release

      - name: tutorial サンプルの実行
        # docs/tutorial.md に載せているコード片(samples/Zdd.Tutorial)を実際に動かし、
        # チュートリアルのサンプルが壊れていないことを確かめる。
        run: >
          dotnet run --project samples/Zdd.Tutorial --no-restore --no-build --configuration Release

      - name: DOT のアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dot
          path: ./dot
          retention-days: 14

      - name: カバレッジのアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: ./coverage
          retention-days: 14

      - name: テスト結果のアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
          retention-days: 14

  build-test-simd-fallback:
    # M4-2（issue #45）: 状態表のハッシュ計算はハードウェアが対応していれば SIMD
    # （Vector256/Vector128）を使うが、この CI ランナーは AVX2 を持つのでその分岐は
    # 通常のジョブでは通らない。ZDD_DISABLE_SIMD=1 で強制的にスカラー経路（非対応環境の
    # フォールバックと同じコード）を通し、全テストが変わらず通ることを確かめる。
    runs-on: ubuntu-latest
    env:
      ZDD_DISABLE_SIMD: "1"
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: リストア
        run: dotnet restore ZDD.Net.sln

      - name: ビルド
        run: dotnet build ZDD.Net.sln --no-restore --configuration Release

      - name: テスト（SIMD フォールバック経路）
        run: >
          dotnet test tests/ZDD.Net.Tests/ZDD.Net.Tests.csproj
          --no-restore
          --no-build
          --configuration Release
          --logger trx
          --results-directory ./coverage-simd-fallback

      - name: テスト結果のアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-simd-fallback
          path: "**/*.trx"
          retention-days: 14

  build-test-parallel-frontier:
    # M4-3（issue #46）: レベル内展開の並列パスは、幅が閾値（既定 2048 状態）を超えた水準でしか
    # 動かないが、既存のテストのお題はほとんどそこまで幅が無い。ZDD_FORCE_PARALLEL_FRONTIER=1 で
    # 閾値を無視させ、既存の M1〜M3 の全テスト（結合ロジックを含む）を並列パス経由で強制的に通し、
    # 逐次実行と変わらず通ることを確かめる（並列度によらずノード ID が一致するという本機能の
    # 決定性の主張を、既存の全テストで裏付ける。docs/benchmarks.md の M4-3 節参照）。
    runs-on: ubuntu-latest
    env:
      ZDD_FORCE_PARALLEL_FRONTIER: "1"
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: リストア
        run: dotnet restore ZDD.Net.sln

      - name: ビルド
        run: dotnet build ZDD.Net.sln --no-restore --configuration Release

      - name: テスト（並列フロンティア経路）
        run: >
          dotnet test tests/ZDD.Net.Tests/ZDD.Net.Tests.csproj
          --no-restore
          --no-build
          --configuration Release
          --logger trx
          --results-directory ./coverage-parallel-frontier

      - name: プロパティテスト（並列フロンティア経路）
        run: >
          dotnet test tests/ZDD.Net.Tests.Properties/ZDD.Net.Tests.Properties.csproj
          --no-restore
          --no-build
          --configuration Release
          --logger trx
          --results-directory ./coverage-parallel-frontier

      - name: テスト結果のアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-parallel-frontier
          path: "**/*.trx"
          retention-days: 14
