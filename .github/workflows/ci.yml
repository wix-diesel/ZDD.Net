name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: リストア
        run: dotnet restore ZDD.Net.sln

      - name: ビルド
        run: dotnet build ZDD.Net.sln --no-restore --configuration Release

      - name: テスト
        run: >
          dotnet test tests/ZDD.Net.Tests/ZDD.Net.Tests.csproj
          --no-restore
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger trx

      - name: プロパティテスト
        # 既定の試行回数は 1 プロパティ 100 回（tests/ZDD.Net.Tests.Properties の PropertyCheck）。
        # 増やしたいときは ZDD_PROPERTY_ITER を、種を変えたいときは ZDD_PROPERTY_SEED を渡す。
        run: >
          dotnet test tests/ZDD.Net.Tests.Properties/ZDD.Net.Tests.Properties.csproj
          --no-restore
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger trx

      - name: Graphviz のインストール
        # DOT 出力（Zdd.ToDot）の文法を本物の dot に通して確かめるため。テスト側
        # （tests/ZDD.Net.Tests/Harness/DotSyntax.cs）が見るのは構造だけで、文法そのものは見ない。
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y graphviz

      - name: サンプル CLI の実行と DOT の検証
        run: |
          set -euo pipefail
          mkdir -p ./dot
          for family in powerset singletons full; do
            dotnet run --project samples/Zdd.Cli --no-restore --no-build --configuration Release \
              -- --family "$family" --items 6 --stats --dot "./dot/$family.gv"
            dot -Tsvg "./dot/$family.gv" -o "./dot/$family.svg"
          done

      - name: DOT のアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dot
          path: ./dot
          retention-days: 14

      - name: カバレッジのアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: ./coverage
          retention-days: 14

      - name: テスト結果のアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
          retention-days: 14
