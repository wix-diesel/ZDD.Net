name: Release

# vX.Y.Z のような正式版タグ（サフィックスなし）を main ブランチ上に打つと、そのタグから
# バージョンを起こして dotnet pack し、.nupkg を生成する。あわせて GitHub Release を
# 自動作成し（リリースノートは自動生成）、.nupkg を添付する。
#
# NuGet.org への実公開は任意。リポジトリの Secrets に NUGET_API_KEY を設定した場合のみ
# 公開ステップが実行される（未設定なら .nupkg の生成・GitHub Release の作成までを行う）。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: タグからバージョンを決定
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # "v1.0.0" -> version="1.0.0"
          version="${tag#v}"
          if [[ "$version" == *-* ]]; then
            echo "error: tag '$tag' must be a formal release tag (expected vX.Y.Z, no suffix)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: リストア
        run: dotnet restore ZDD.Net.sln

      - name: ビルド
        run: dotnet build ZDD.Net.sln --no-restore --configuration Release

      - name: テスト
        run: >
          dotnet test tests/ZDD.Net.Tests/ZDD.Net.Tests.csproj
          --no-restore
          --no-build
          --configuration Release

      - name: パッケージの作成
        run: >
          dotnet pack src/ZDD.Net/ZDD.Net.csproj
          --no-restore
          --configuration Release
          --output ./artifacts
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:VersionSuffix=

      - name: 生成されたバージョンの確認
        # 正式版タグどおりのバージョンで .nupkg ができていることを確かめる。
        run: |
          set -euo pipefail
          expected="./artifacts/ZDD.Net.${{ steps.version.outputs.version }}.nupkg"
          if [ ! -f "$expected" ]; then
            echo "error: expected package not found: $expected" >&2
            ls ./artifacts >&2 || true
            exit 1
          fi
          echo "$expected"

      - name: .nupkg のアップロード
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 90

      - name: GitHub Release の作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          ./artifacts/*.nupkg
          --title "${{ steps.version.outputs.tag }}"
          --generate-notes

      - name: NuGet.org への公開
        # NUGET_API_KEY が設定されていないリポジトリでは何もしない（実公開は任意）。
        if: ${{ env.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
